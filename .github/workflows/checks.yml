name: Check and package addon

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - name: Build installable addon
        run: |
          package_archive="$(python tools/package.py)"
          unzip -q "$package_archive" -d dist/install
      - uses: actions/upload-artifact@v4
        with:
          name: NeonOmen-test-build
          path: dist/install/
          if-no-files-found: error
